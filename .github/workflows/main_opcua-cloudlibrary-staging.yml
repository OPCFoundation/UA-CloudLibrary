# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - opcua-cloudlibrary-staging

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the full history to compute a version

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      # Build/publish the web project only. Pointing at the solution would drag in the
      # docker-compose project, the test projects and the other tools, and `dotnet publish`
      # does not accept -o for a solution.
      - name: Restore
        run: dotnet restore UACloudLibraryServer/UA-CloudLibrary.csproj

      - name: Build with dotnet
        run: dotnet build UACloudLibraryServer/UA-CloudLibrary.csproj --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish UACloudLibraryServer/UA-CloudLibrary.csproj --configuration Release --no-build --output "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_34BF74BCB51B4C2DAAECC4001A316E9E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DD569F9850C043F79744A2A511A7EF4B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_409A3B02C459422F8C98F8357F6747C5 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'opcua-cloudlibrary-staging'
          slot-name: 'Production'
          package: .
          